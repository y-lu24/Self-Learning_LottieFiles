<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottie Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="lottie-test">
 
  <header class="page-header">
    <h1>Lottie Animation Test</h1>
  </header>
 
  <main class="animation-grid">
 
    <div class="card">
      <h2>Animation 1 — Shapes</h2>
      <lottie-player
        src="animation/Shapes.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
 
    <div class="card">
      <h2>Animation 2 — Text</h2>
      <lottie-player
        src="animation/Text.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
 
    <div class="card">
      <h2>Animation 3 — VII INK Loader</h2>
      <lottie-player
        src="animation/VII-ink-loader.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
 
  </main>
 
</body>
</html>
